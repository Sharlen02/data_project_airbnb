version: 2

models:
  - name: dim_hosts
    description: "Dimension hôtes — vue directe sur silver_hosts, prête pour la restitution Streamlit"
    columns:
      - name: host_id
        tests:
          - not_null
          - unique
      - name: host_name
        tests:
          - not_null
      - name: is_superhost
        tests:
          - not_null

  - name: dim_listings
    description: "Dimension logements — vue directe sur silver_listings"
    columns:
      - name: listing_id
        tests:
          - not_null
          - unique
      - name: host_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_hosts')
              field: host_id
      - name: room_type
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Entire home/apt'
                - 'Private room'
                - 'Shared room'
                - 'Hotel room'
      - name: price
        tests:
          - not_null

  - name: fact_reviews
    description: "Table de faits des avis — filtrée (review_text non null), triée par date desc"
    columns:
      - name: listing_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_listings')
              field: listing_id
      - name: review_date
        tests:
          - not_null
      - name: review_text
        tests:
          - not_null
      - name: sentiment
        tests:
          - accepted_values:
              values: ['positive', 'negative', 'neutral']
              config:
                severity: warn

  - name: full_moon_reviews
    description: "Avis enrichis avec indicateur pleine lune — JOIN décalé de +1 jour sur la date"
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: review_date
        tests:
          - not_null
      - name: review_text
        tests:
          - not_null
      - name: is_full_moon
        description: "Vaut 'full moon' ou 'not full moon'"
        tests:
          - not_null
          - accepted_values:
              values: ['full moon', 'not full moon']
      - name: sentiment
        tests:
          - accepted_values:
              values: ['positive', 'negative', 'neutral']
              config:
                severity: warn